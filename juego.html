<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelea de Robots</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        #contenedor { text-align: center; }
        canvas {
            background: #0a0e1a;
            border: 3px solid #4fc3f7;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.4);
            display: block;
        }
        #info {
            color: #e0e0e0;
            margin-top: 15px;
            font-size: 0.95rem;
            line-height: 1.7;
        }
        #info b { color: #4fc3f7; }
        #info .rojo { color: #ff5252; }
    </style>
</head>
<body>
    <div id="contenedor">
        <canvas id="juego" width="800" height="450"></canvas>
        <div id="info">
            <b>P1 (azul):</b> WASD para moverte · Espacio para disparar<br>
            <span class="rojo"><b>P2 (rojo):</b> IJKL para moverte · Enter para disparar</span><br>
            Cada uno tiene 5 vidas · Pulsa <b>R</b> para reiniciar
        </div>
    </div>

    <script>
        const canvas = document.getElementById('juego');
        const ctx = canvas.getContext('2d');

        // ===== ESTADO DEL JUEGO =====
        const juego = {
            p1: { x: 150, y: 225, vidas: 5, dir: 1, cooldown: 0, paso: 0 },
            p2: { x: 650, y: 225, vidas: 5, dir: -1, cooldown: 0, paso: 0 },
            proyectiles: [],
            impactos: [],
            ganador: null,
            teclas: {}
        };

        // ===== CONTROLES =====
        document.addEventListener('keydown', e => {
            juego.teclas[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'r') reiniciar();
        });
        document.addEventListener('keyup', e => {
            juego.teclas[e.key.toLowerCase()] = false;
        });

        function reiniciar() {
            juego.p1 = { x: 150, y: 225, vidas: 5, dir: 1, cooldown: 0, paso: 0 };
            juego.p2 = { x: 650, y: 225, vidas: 5, dir: -1, cooldown: 0, paso: 0 };
            juego.proyectiles = [];
            juego.impactos = [];
            juego.ganador = null;
        }

        // ===== DISPARAR =====
        function disparar(robot, dir) {
            if (robot.cooldown > 0) return;
            juego.proyectiles.push({
                x: robot.x + dir * 38,
                y: robot.y - 2,
                dir: dir,
                dueño: robot === juego.p1 ? 'p1' : 'p2'
            });
            robot.cooldown = 15;
        }

        // ===== MOVIMIENTO Y FÍSICA =====
        function actualizar() {
            if (juego.ganador) return;

            const t = juego.teclas;
            let moviendo1 = false, moviendo2 = false;

            // Movimiento P1 (WASD)
            if (t['w'] && juego.p1.y > 55) juego.p1.y -= 4;
            if (t['s'] && juego.p1.y < 395) juego.p1.y += 4;
            if (t['a'] && juego.p1.x > 45) { juego.p1.x -= 4; juego.p1.dir = -1; moviendo1 = true; }
            if (t['d'] && juego.p1.x < 380) { juego.p1.x += 4; juego.p1.dir = 1; moviendo1 = true; }
            if (t[' ']) disparar(juego.p1, juego.p1.dir);

            // Movimiento P2 (IJKL)
            if (t['i'] && juego.p2.y > 55) juego.p2.y -= 4;
            if (t['k'] && juego.p2.y < 395) juego.p2.y += 4;
            if (t['j'] && juego.p2.x > 420) { juego.p2.x -= 4; juego.p2.dir = -1; moviendo2 = true; }
            if (t['l'] && juego.p2.x < 755) { juego.p2.x += 4; juego.p2.dir = 1; moviendo2 = true; }
            if (t['enter']) disparar(juego.p2, juego.p2.dir);

            // Animación de caminar
            juego.p1.paso = moviendo1 ? juego.p1.paso + 0.25 : 0;
            juego.p2.paso = moviendo2 ? juego.p2.paso + 0.25 : 0;

            // Cooldowns
            if (juego.p1.cooldown > 0) juego.p1.cooldown--;
            if (juego.p2.cooldown > 0) juego.p2.cooldown--;

            // Proyectiles
            for (let i = juego.proyectiles.length - 1; i >= 0; i--) {
                const p = juego.proyectiles[i];
                p.x += p.dir * 8;

                if (p.x < -20 || p.x > 820) {
                    juego.proyectiles.splice(i, 1);
                    continue;
                }

                if (p.dueño === 'p1' && colision(p, juego.p2)) {
                    juego.p2.vidas--;
                    juego.impactos.push({ x: juego.p2.x, y: juego.p2.y, vida: 15 });
                    juego.proyectiles.splice(i, 1);
                    if (juego.p2.vidas <= 0) juego.ganador = 'P1';
                }
                else if (p.dueño === 'p2' && colision(p, juego.p1)) {
                    juego.p1.vidas--;
                    juego.impactos.push({ x: juego.p1.x, y: juego.p1.y, vida: 15 });
                    juego.proyectiles.splice(i, 1);
                    if (juego.p1.vidas <= 0) juego.ganador = 'P2';
                }
            }

            for (let i = juego.impactos.length - 1; i >= 0; i--) {
                juego.impactos[i].vida--;
                if (juego.impactos[i].vida <= 0) juego.impactos.splice(i, 1);
            }
        }

        function colision(p, robot) {
            return Math.abs(p.x - robot.x) < 30 && Math.abs(p.y - robot.y) < 32;
        }

        // ===== DIBUJAR =====
        function dibujar() {
            const grad = ctx.createLinearGradient(0, 0, 0, 450);
            grad.addColorStop(0, '#0d1b3e');
            grad.addColorStop(1, '#1a0b2e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 800, 450);

            // Cuadrícula
            ctx.strokeStyle = 'rgba(79, 195, 247, 0.15)';
            ctx.lineWidth = 1;
            for (let x = 0; x < 800; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 450); ctx.stroke();
            }
            for (let y = 0; y < 450; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke();
            }

            // Línea central
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath(); ctx.moveTo(400, 0); ctx.lineTo(400, 450); ctx.stroke();
            ctx.setLineDash([]);

            // Proyectiles
            for (const p of juego.proyectiles) {
                const color = p.dueño === 'p1' ? '#4fc3f7' : '#ff5252';
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Robots
            dibujarRobot(juego.p1, '#4fc3f7', '#1565c0', 'P1');
            dibujarRobot(juego.p2, '#ff5252', '#b71c1c', 'P2');

            // Impactos
            for (const imp of juego.impactos) {
                const alpha = imp.vida / 15;
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(imp.x, imp.y, 20 - imp.vida, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Ganador
            if (juego.ganador) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.fillRect(0, 0, 800, 450);
                ctx.fillStyle = juego.ganador === 'P1' ? '#4fc3f7' : '#ff5252';
                ctx.font = 'bold 40px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(`🏆 ¡Gana ${juego.ganador}!`, 400, 210);
                ctx.fillStyle = '#ffffff';
                ctx.font = '18px Segoe UI';
                ctx.fillText('Pulsa R para jugar de nuevo', 400, 250);
            }
        }

        // ===== ROBOT CON CUERPO COMPLETO Y PISTOLA =====
        function dibujarRobot(r, colorClaro, colorOscuro, nombre) {
            const d = r.dir;                 // 1 = mira a la derecha, -1 = izquierda
            const balanceo = Math.sin(r.paso) * 3; // animación de piernas

            ctx.save();
            ctx.translate(r.x, r.y);

            // Sombra en el suelo
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(0, 34, 26, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // ===== PIERNAS =====
            ctx.fillStyle = colorOscuro;
            ctx.beginPath(); ctx.roundRect(-13, 12 + balanceo, 10, 20, 3); ctx.fill();
            ctx.beginPath(); ctx.roundRect(3, 12 - balanceo, 10, 20, 3); ctx.fill();
            // Pies
            ctx.fillStyle = '#2b2b3a';
            ctx.beginPath(); ctx.roundRect(-15, 30 + balanceo, 14, 6, 3); ctx.fill();
            ctx.beginPath(); ctx.roundRect(1, 30 - balanceo, 14, 6, 3); ctx.fill();

            // ===== BRAZO TRASERO =====
            ctx.fillStyle = colorOscuro;
            ctx.beginPath(); ctx.roundRect(-d * 16 - 4, -6, 8, 18, 4); ctx.fill();

            // ===== TORSO =====
            ctx.shadowColor = colorClaro;
            ctx.shadowBlur = 18;
            ctx.fillStyle = colorClaro;
            ctx.beginPath(); ctx.roundRect(-16, -12, 32, 28, 8); ctx.fill();
            ctx.shadowBlur = 0;

            // Panel del pecho
            ctx.fillStyle = colorOscuro;
            ctx.beginPath(); ctx.roundRect(-9, -6, 18, 14, 4); ctx.fill();
            // Lucecita del pecho
            ctx.fillStyle = '#ffd54f';
            ctx.beginPath(); ctx.arc(0, 1, 3, 0, Math.PI * 2); ctx.fill();

            // ===== CABEZA =====
            ctx.fillStyle = colorClaro;
            ctx.beginPath(); ctx.roundRect(-14, -38, 28, 24, 7); ctx.fill();

            // Antena
            ctx.strokeStyle = colorOscuro;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, -38); ctx.lineTo(0, -47); ctx.stroke();
            ctx.fillStyle = '#ffd54f';
            ctx.shadowColor = '#ffd54f';
            ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.arc(0, -49, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // Visor
            ctx.fillStyle = '#101820';
            ctx.beginPath(); ctx.roundRect(-10, -32, 20, 11, 4); ctx.fill();
            // Ojos brillantes mirando al frente
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.arc(d * 1 - 4, -26.5, 2.4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(d * 1 + 4, -26.5, 2.4, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            // ===== BRAZO DELANTERO + PISTOLITA =====
            // Brazo
            ctx.fillStyle = colorClaro;
            ctx.beginPath(); ctx.roundRect(d * 12 - 4, -6, 10, 16, 4); ctx.fill();

            // Pistola
            ctx.save();
            ctx.translate(d * 20, -2);
            if (d === -1) ctx.scale(-1, 1);
            // Cañón
            ctx.fillStyle = '#3a3a4a';
            ctx.beginPath(); ctx.roundRect(0, -4, 16, 7, 2); ctx.fill();
            // Cuerpo/empuñadura
            ctx.fillStyle = '#22222e';
            ctx.beginPath(); ctx.roundRect(-2, 0, 8, 10, 2); ctx.fill();
            // Puntita brillante
            ctx.fillStyle = colorClaro;
            ctx.shadowColor = colorClaro;
            ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.arc(16, -0.5, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();

            ctx.restore();

            // ===== NOMBRE Y VIDAS (sin rotar) =====
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 13px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(nombre, r.x, r.y - 58);

            for (let i = 0; i < 5; i++) {
                ctx.fillStyle = i < r.vidas ? '#ffd54f' : 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.arc(r.x - 20 + i * 10, r.y + 50, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ===== BUCLE DEL JUEGO =====
        function bucle() {
            actualizar();
            dibujar();
            requestAnimationFrame(bucle);
        }
        bucle();
    </script>
</body>
</html>
